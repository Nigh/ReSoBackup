version: '3'

tasks:
  build:
    desc: Build the native application for the current platform
    cmds:
      - go build -trimpath -ldflags '-s -w' -o dist/rsbackup{{exeExt}} .
    env:
      CGO_ENABLED: '0'
  package:
    desc: Package the native application for the current platform
    cmds:
      - go tool mygo build
  run:
    cmds:
      - go run .
  dev:
    desc: Rebuild and restart the native application on changes
    cmds:
      - go tool mygo dev
  test:
    cmds:
      - go vet ./...
      - go test ./...
      - go test -tags cli ./...
