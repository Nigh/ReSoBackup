name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-binary:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rsbackup_linux_amd64
          - os: windows-latest
            artifact: rsbackup_windows_amd64.exe
          - os: macos-latest
            artifact: rsbackup_darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          go tool mygo vet .
          go test ./...
          go test -tags cli ./...
      - name: Build native application
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags '-s -w' -o 'dist/${{ matrix.artifact }}' .
      - name: Set package version
        if: runner.os != 'Windows'
        shell: bash
        run: python -c 'import json, os; p="mygo.json"; c=json.load(open(p)); c["version"]=os.environ["GITHUB_REF_NAME"].removeprefix("v"); open(p,"w").write(json.dumps(c, indent=2)+"\n")'
      - name: Package native application
        if: runner.os != 'Windows'
        run: go tool mygo build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/packages/**/*.dmg
            dist/packages/**/*.deb
            dist/packages/**/*.tar.gz
  release:
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
